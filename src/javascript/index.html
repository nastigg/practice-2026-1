<!DOCTYPE html>
<html>
<head>
    <title>Build your own 3D renderer</title>
</head>
<body>
<canvas id="canvas" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

const spheres = [
    {x:0, y:0, z:3, r:1, color:[255,0,0]},
    {x:2, y:0, z:4, r:1, color:[0,255,0]},
    {x:-2, y:0, z:4, r:1, color:[0,0,255]}
];

const light = {x:5, y:5, z:-10};

function normalize(v){
    const len = Math.sqrt(v.x*v.x+v.y*v.y+v.z*v.z);
    return {x:v.x/len,y:v.y/len,z:v.z/len};
}

function dot(a,b){
    return a.x*b.x+a.y*b.y+a.z*b.z;
}

function intersect(ray, sphere){
    const oc = {
        x:ray.x - sphere.x,
        y:ray.y - sphere.y,
        z:ray.z - sphere.z
    };

    const a = dot(ray.dir, ray.dir);
    const b = 2 * dot(oc, ray.dir);
    const c = dot(oc, oc) - sphere.r*sphere.r;

    const d = b*b - 4*a*c;
    if(d < 0) return null;

    return (-b - Math.sqrt(d)) / (2*a);
}

// рендер
function render(){
    const img = ctx.createImageData(width,height);

    for(let y=0;y<height;y++){
        for(let x=0;x<width;x++){

            const nx = (x-width/2)/width;
            const ny = (y-height/2)/height;

            const ray = {
                x:0, y:0, z:0,
                dir: normalize({x:nx,y:ny,z:1})
            };

            let closest = Infinity;
            let hit = null;

            for(const s of spheres){
                const t = intersect(ray,s);
                if(t && t < closest){
                    closest = t;
                    hit = s;
                }
            }

            let index = (y*width + x)*4;

            if(hit){

                const px = ray.dir.x * closest;
                const py = ray.dir.y * closest;
                const pz = ray.dir.z * closest;

                const normal = normalize({
                    x:px - hit.x,
                    y:py - hit.y,
                    z:pz - hit.z
                });

                const lightDir = normalize({
                    x:light.x - px,
                    y:light.y - py,
                    z:light.z - pz
                });

                let brightness = Math.max(0, dot(normal, lightDir));

                // тень
                let shadow = false;

                for(const s of spheres){
                    if(s === hit) continue;
                    const shadowRay = {x:px,y:py,z:pz,dir:lightDir};
                    const t = intersect(shadowRay,s);
                    if(t){
                        shadow = true;
                        break;
                    }
                }

                if(shadow) brightness *= 0.3;

                img.data[index] = hit.color[0]*brightness;
                img.data[index+1] = hit.color[1]*brightness;
                img.data[index+2] = hit.color[2]*brightness;
                img.data[index+3] = 255;

            } else {
                img.data[index] = 0;
                img.data[index+1] = 0;
                img.data[index+2] = 0;
                img.data[index+3] = 255;
            }
        }
    }

    ctx.putImageData(img,0,0);
}

render();
</script>
</body>
</html>
